<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efe9e0">
  <meta name="robots" content="noindex">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("bupTheme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <title>My Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="/" aria-label="Home"><span class="brand-mark"><img src="/icons/logo-white.png" alt=""></span><span><strong>My Dashboard</strong><small id="who">&nbsp;</small></span></a>
    <button id="lockBtn" class="icon-btn" aria-label="Lock dashboard" style="font-weight:600;font-size:13px;width:auto;padding:0 16px;border-radius:22px">Lock</button>
  </header>
  <main>
    <h1 class="page-title" id="hello">Welcome</h1>
    <p class="page-sub">This page is only visible after a correct PIN.</p>
    <div class="card" style="margin-top:20px">
      <h3>Dashboard coming soon</h3>
      <p class="hint" style="margin:0">Put your dashboard files inside <b>public/dashboard/</b> (replace this page). Everything in that folder is protected by the PIN login.</p>
    </div>
  </main>
</div>
<script>
fetch("/api/me",{credentials:"same-origin"}).then(function(r){return r.json()}).then(function(d){
  if(!d.ok){location.replace("/?unlock=1");return}
  document.getElementById("hello").textContent="Hi, "+d.nickname;
  document.getElementById("who").textContent="Student ID "+d.studentId;
}).catch(function(){});
document.getElementById("lockBtn").addEventListener("click",function(){
  fetch("/api/logout",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:"{}"}).finally(function(){location.href="/"});
});
addEventListener("pageshow",function(e){if(e.persisted)location.reload()});
</script>
</body>
</html>
