<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1f1f2">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("bupTheme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <title>Cover Page Generator</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
</defs></svg>
<div class="app">
  <header class="topbar">
    <a id="homeLink" class="icon-btn" href="index.html" aria-label="Home"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg></a>
    <strong style="font-size:17px;font-weight:600">Cover Page Generator</strong>
    <button id="themeToggle" class="icon-btn" aria-label="Switch light or dark mode"><svg class="ic" aria-hidden="true"><use href="#i-moon"/></svg></button>
  </header>

  <!-- Step 1: pick the type of cover page -->
  <section id="cpPick" aria-labelledby="cpPickTitle">
    <h1 class="page-title" id="cpPickTitle">Which cover page?</h1>
    <p class="page-sub">Pick one to get started.</p>
    <div class="tools cp-cards">
      <button type="button" class="tool-card cp-card" data-type="assignment" aria-label="Assignment cover page">
        <div class="tool-art">
          <svg viewBox="0 0 260 170" class="doodle" role="img" aria-label="Doodle of an assignment cover page with a pencil">
            <g class="bob">
              <rect class="fill" x="78" y="8" width="104" height="154" rx="10" transform="rotate(-3 130 84)"/>
              <g transform="rotate(-3 130 84)">
                <circle class="fill2" cx="130" cy="32" r="12"/>
                <path class="thin" d="M125 32l4 4 7-8"/>
                <path d="M104 58h52"/>
                <path class="thin" d="M110 70h40M114 80h32"/>
                <path class="thin" d="M96 104h30M134 104h30M96 118h30M134 118h30"/>
                <path class="thin" d="M96 138h68"/>
              </g>
            </g>
            <g class="bob2">
              <g transform="rotate(38 212 100)">
                <rect class="fill2" x="204" y="66" width="16" height="58" rx="3"/>
                <path class="fill" d="M204 124l8 15 8-15z"/>
                <path class="thin" d="M204 78h16"/>
              </g>
            </g>
            <path d="M44 42l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
            <path class="thin" d="M24 120c10-12 20 12 30 0s20 12 30 0"/>
          </svg>
        </div>
        <div class="tool-body"><div><h2>Assignment</h2><p>Cover page for theory courses</p></div></div>
      </button>
      <button type="button" class="tool-card cp-card blue" data-type="lab" aria-label="Lab report cover page">
        <div class="tool-art">
          <svg viewBox="0 0 260 170" class="doodle" role="img" aria-label="Doodle of a lab report cover page with a flask">
            <g class="bob">
              <rect class="fill" x="78" y="8" width="104" height="154" rx="10" transform="rotate(3 130 84)"/>
              <g transform="rotate(3 130 84)">
                <circle class="fill2" cx="130" cy="32" r="12"/>
                <path class="thin" d="M125 32l4 4 7-8"/>
                <path d="M104 58h52"/>
                <path class="thin" d="M110 70h40M114 80h32"/>
                <path class="thin" d="M96 104h30M134 104h30M96 118h30M134 118h30"/>
                <path class="thin" d="M96 138h68"/>
              </g>
            </g>
            <g class="bob2">
              <path class="fill2" d="M200 62h16v22l16 30a6 6 0 0 1-5 9h-38a6 6 0 0 1-5-9l16-30z"/>
              <path class="thin" d="M196 62h24M190 108h36"/>
              <circle class="fill" cx="208" cy="118" r="3"/>
            </g>
            <path d="M44 42l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
            <path class="thin" d="M24 120c10-12 20 12 30 0s20 12 30 0"/>
          </svg>
        </div>
        <div class="tool-body"><div><h2>Lab Report</h2><p>Cover page for lab courses</p></div></div>
      </button>
    </div>
  </section>

  <!-- Step 2: the form for the chosen type -->
  <div id="cpFormWrap" class="hidden">
    <button id="cpBack" class="cp-back" type="button" aria-label="Back to cover page types">&#8249; Back</button>
    <section class="card" aria-live="polite">
      <h3 id="cpTitle">Assignment cover page</h3>
      <p class="hint">Fill in the details and get a ready-to-print PDF. Everything stays on your phone, nothing is uploaded.</p>
      <div id="cpForm" class="cp-form"></div>
      <button id="cpGo" class="btn" type="button">Generate PDF</button>
      <button id="cpClear" class="btn ghost" type="button">Clear saved details</button>
    </section>
  <section id="cpDone" class="card hidden" aria-live="polite">
    <h3>Your PDF is ready</h3>
    <p class="hint" id="cpName"></p>
    <a id="cpDl" class="btn" href="#" download>Download PDF</a>
    <button id="cpShare" class="btn ghost" type="button">Open / Share</button>
  </section>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="./vendor/pdf-lib.min.js"></script>
<script src="./config.js"></script>
<script src="./common.js"></script>
<script src="./courses.js"></script>
<script src="./cover-pdf.js"></script>
<script src="./cover.js"></script>
</body>
</html>
